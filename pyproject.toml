[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dealsource"
version = "0.1.0"
description = "Turn an investment thesis into a ranked, explained list of acquisition targets."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "osmium>=4.0",
    "selectolax>=0.3.21",
    "tldextract>=5.1",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-socket>=0.7",
    "ruff>=0.5",
]

[project.scripts]
dealsource = "dealsource.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dealsource"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# The formatter handles code layout; long SQL and message strings are fine.
ignore = ["E501", "SIM905"]  # SIM905: word lists read better as str.split()
